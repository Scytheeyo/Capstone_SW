    <script>

    document.getElementById('hamburger-menu').addEventListener('click', function() {
        var navMenu = document.getElementById('nav-menu');
        if (navMenu.style.display === 'block') {
            navMenu.style.display = 'none';
        } else {
            navMenu.style.display = 'block';
        }
    });

    document.getElementById('hamburger-menu').addEventListener('mouseenter', function() {
        var navMenu = document.getElementById('nav-menu');
        navMenu.style.display = 'block';
    });

    document.getElementById('hamburger-menu').addEventListener('mouseleave', function() {
        var navMenu = document.getElementById('nav-menu');
        navMenu.style.display = 'none';
    });

    window.addEventListener('resize', function() {
        const navMenu = document.getElementById('nav-menu');
        const hamburger = document.getElementById('hamburger-menu');

        // 창 크기가 600px 이상이면 메뉴 항상 표시
        if (window.innerWidth > 600) {
            navMenu.style.display = 'flex'; // 또는 'block'으로 바꿔도 됨
        } else {
            navMenu.style.display = 'none'; // 작아지면 다시 숨기기
        }
    });

    // ✅ 수정 및 추가. URL을 백엔드에 전송하는 submitUrl 함수 정의
    function submitUrl() {
        const url = document.getElementById('url-input').value.trim();

        // 입력값 없을 시 경고창 띄우기
        if (!url) {
            alert("URL을 입력해주세요.");
            return;
        }

        // 추가. Flask 백엔드에 URL을 POST 방식으로 전송
        fetch('/api/submit-url', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url: url }),
    credentials: 'include'  // ✅ 인증 쿠키 포함!
})

        .then(res => {
            // 수정. res.ok 여부만 확인하고 후처리 없었어서 추가함
            if (res.ok) {
                alert("URL이 성공적으로 전송되었습니다.");
            } else {
                throw new Error("URL 전송 실패");
            }
        })
        .catch(err => alert(err.message));  // 오류 알림
    }
    
    document.getElementById('h2-link').addEventListener('click', function (e) {
        e.preventDefault(); // 기본 이동 막기

        fetch('/api/check-admin')
            .then(res => {
                if (!res.ok) throw new Error("권한 오류");
                return res.json();
            })
            .then(data => {
                if (data.isAdmin) {
                    window.location.href = "/h2-console";
                } else {
                    alert("관리자만 접근할 수 있습니다.");
                }
            })
            .catch(err => {
                alert("접근 오류: " + err.message);
            });
    });

</script>
