        <script>
        // 수정 및 추가. URL을 백엔드에 전송
        function submitUrl() {
            const url = document.getElementById('url-input').value.trim();

            // 입력값 없을 시 경고창 띄우기
            if (!url) {
                alert("URL을 입력해주세요.");
                return;
            }

            // 추가. Flask 백엔드에 URL을 POST 방식으로 전송
            fetch('/api/submit-url', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url }),
                credentials: 'include'
            })

            .then(res => {
                // 수정. res.ok 여부만 확인하고 후처리 없었어서 추가함
                if (res.ok) {
                    alert("URL이 성공적으로 전송되었습니다.");
                } else {
                    throw new Error("URL 전송 실패");
                }
            })
            .catch(err => alert(err.message));  // 오류 알림
        }

        document.getElementById('hamburger-menu').addEventListener('click', function() {
            var navMenu = document.getElementById('nav-menu');
            if (navMenu.style.display === 'block') {
                navMenu.style.display = 'none';
            } else {
                navMenu.style.display = 'block';
            }
        });

        document.getElementById('hamburger-menu').addEventListener('mouseenter', function() {
            var navMenu = document.getElementById('nav-menu');
            navMenu.style.display = 'block';
        });

        document.getElementById('hamburger-menu').addEventListener('mouseleave', function() {
            var navMenu = document.getElementById('nav-menu');
            navMenu.style.display = 'none';
        });

        window.addEventListener('resize', function() {
            const navMenu = document.getElementById('nav-menu');
            const hamburger = document.getElementById('hamburger-menu');

            // 창 크기가 600px 이상이면 메뉴 항상 표시
            if (window.innerWidth > 600) {
                navMenu.style.display = 'flex'; // 또는 'block'으로 바꿔도 됨
            } else {
                navMenu.style.display = 'none'; // 작아지면 다시 숨기기
            }
        });
        
        document.getElementById('h2-link').addEventListener('click', function (e) {
            e.preventDefault(); // 기본 이동 막기

            fetch('/api/check-admin')
                .then(res => {
                    if (!res.ok) throw new Error("권한 오류");
                    return res.json();
                })
                .then(data => {
                    if (data.isAdmin) {
                        window.location.href = "/h2-console";
                    } else {
                        alert("관리자만 접근할 수 있습니다.");
                    }
                })
                .catch(err => {
                    alert("접근 오류: " + err.message);
                });
        });

        //logout 함수
        function logout() {
            fetch('/logout', {
                method: 'POST',
                crendentials: 'include'
            })
            .then(res => {
                if(res.ok) {
                    alert("로그아웃 되었습니다");
                    window.location.href = "MainPage.html";
                } else {
                    throw new Error("로그아웃 실패");
                }
            })
            .catch(err => {
                alert("에러 : " + err.message);
            })
        }


        /* 로그인 / 로그아웃 체크 */
        async function checkLoginStatus() {
            try {
                const response = await fetch('/api/currentUser', {
                    method: 'GET',
                    credentials: 'include'
                });
                const username = await response.text();
                return username !== 'anonymousUser';
            } catch (error) {
                console.error('로그인 상태 확인 실패:', error);
                return false;
            }
        }
        async function toggleButton() {
            const loginButton = document.getElementById('login_btn');
            const logoutButton = document.getElementById('logout_btn');

            if (!loginButton || !logoutButton) {
                console.warn('버튼 요소가 존재하지 않음');
                return;
            }

            if (await checkLoginStatus()) {
                loginButton.style.display = 'none';
                logoutButton.style.display = 'block';
            } else {
                loginButton.style.display = 'block';
                logoutButton.style.display = 'none';
            }
        }

        // 로그아웃 처리
        function setupLogoutButton() {
            const logoutButton = document.getElementById('logout_btn');
            if (!logoutButton) {
                console.warn('로그아웃 버튼이 존재하지 않음');
                return;
            }

            logoutButton.addEventListener('click', async function (e) {
                e.preventDefault(); // 링크 동작 방지

                try {
                    const response = await fetch('/api/logout', {
                        method: 'POST',
                        credentials: 'include'
                    });

                    if (response.ok) {
                        console.log('로그아웃 성공');
                        alert('로그아웃 되었습니다.');
                        toggleButton(); // 버튼 상태 갱신
                        window.location.href = '/login.html'; // 로그인 페이지로 이동
                    } else {
                        console.error('로그아웃 실패:', await response.text());
                    }
                } catch (error) {
                    console.error('로그아웃 요청 중 오류 발생:', error);
                }
            });
        }

        // 초기 실행
        document.addEventListener('DOMContentLoaded', () => {
            toggleButton();
            setupLogoutButton();
        });

        </script>
