<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join</title>
  <link href="css/LoginAndJoin/join.css" rel="stylesheet">
  <link href="css/main/sidebar.css" rel="stylesheet">
</head>
<body>
  <header>
    <aside class="side_bar">
        <section class = "side_bar_icon">
            <section class="side_bar_hamburger_menu">
                <div></div>
                <div></div>
                <div></div>
                <span class="logo_text_clip">clip</span>
                <span class="logo_text_shot">Shot</span>
            </section>
        </section>
        <ul>
            <li><a href="MainPage.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="MyPage.html">MyPage</a></li>
            <li><a href="join.html">SignUp</a></li>
            <li><a href="http://localhost:8080/h2-console/">DB</a></li>
        </ul>
    </aside>
  </header>
  <form onsubmit="register(event)">
    <section class="join_background_img">
      <section class="join_table">
        <table>
          <tr><td><h2>회원가입</h2></td></tr>
          <tr><td>아이디</td></tr>
          <tr><td><input type="text" class="text" /></td></tr>
          <tr><td>비밀번호</td></tr>
          <tr><td><input type="password" class="text" /></td></tr>
          <tr><td>비밀번호 확인</td></tr>
          <tr><td><input type="password" class="text" /></td></tr>
          <tr><td>이름</td></tr>
          <tr><td><input type="text" class="text" /></td></tr>
          <tr><td>이메일</td></tr>
          <tr>
            <td>
              <input type="text" class="email" /> @ 
              <select>
                <option>naver.com</option>
                <option>gmail.com</option>
                <option>daum.net</option>
                <option>nate.com</option>
              </select>
            </td>
          </tr>
          <tr>
            <td>
              <input type="submit" value="가입하기" class="btn" />
            </td>
          </tr>
        </table>        
      </section>
    </section>
  </form>

  <script>
    function register(event) {
      event.preventDefault();

      const username = document.querySelectorAll('.text')[0].value;
      const password = document.querySelectorAll('.text')[1].value;
      const passwordConfirm = document.querySelectorAll('.text')[2].value;
      const name = document.querySelectorAll('.text')[3].value;
      const email1 = document.querySelector('.email').value;
      const email2 = document.querySelector('select').value;
      const email = email1 + '@' + email2;

      if (password !== passwordConfirm) {
        alert("비밀번호가 일치하지 않습니다.");
        return;
      }

      fetch('/api/join', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: username,
          password: password,
          name: name,
          email: email
        })
      })
      .then(res => {
        if (res.ok) {
          alert("가입 성공!");
          window.location.href = "login.html";
        } else {
          return res.text().then(text => { throw new Error(text); });
        }
      })
      .catch(err => alert("에러: " + err.message));
    }
  </script>
</body>
</html>
