<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="css/main/nav.css" rel="stylesheet">
<title>Login</title>
<link href="mainImg/logo_round_favicon.png" rel="icon">
<style>
    table {
        width: 280px;
        height: 250px;
        margin: auto;
        font-size: 15px;
    }
    input[type="text"], input[type="password"] {
        width: 250px;
        height: 32px;
        font-size: 15px;
        border: 0;
        border-radius: 15px;
        outline: none;
        padding-left: 10px;
        background-color: rgb(233,233,233);
    }
    .btn {
        width: 263px;
        height: 32px;
        font-size: 15px;
        border: 0;
        border-radius: 15px;
        outline: none;
        background-color: rgb(255, 140, 0);
    }
    .btn:active {
        background-color: rgb(255, 165, 0);
    }
    a {
        font-size: 12px;
        color: darkgray;
        text-decoration: none;
    }
    .join {
        text-align: center;
    }
</style>
</head>
<body>
    <header>
        <nav>
            <div id="hamburger-menu">
                <div></div>
                <div></div>
                <div></div>
            </div>
            <ul id="nav-menu">
                <li><a href="MainPage.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="MyPage.html">MyPage</a></li>
                <li><a href="join.html">SignUp</a></li>
            </ul>
        </nav>
    </header>
<form onsubmit="login(event)">
    <table>
        <tr><td><h2>로그인</h2></td></tr>
        <tr><td><input type="text" placeholder="ID"></td></tr>
        <tr><td><input type="password" placeholder="Password"></td></tr>
        <tr><td><input type="checkbox"> 로그인 정보 저장</td></tr>
        <tr><td><input type="submit" value="Sign in" class="btn"></td></tr>
        <tr><td class="join"><a href="join.html">회원가입</a></td></tr>
    </table>
</form>

<script>
function login(event) {
    event.preventDefault(); // 기본 제출 막기

    const username = document.querySelector('input[type="text"]').value;
    const password = document.querySelector('input[type="password"]').value;

    fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
    })
    .then(res => {
        if (res.ok) return res.text();
        else throw new Error("로그인 실패");
    })
    .then(msg => {
        alert(msg);
        // 로그인 성공 후 이동하고 싶으면 여기 활성화
        // window.location.href = "/main.html";
    })
    .catch(err => alert(err.message));
}
</script>

</body>
</html>
